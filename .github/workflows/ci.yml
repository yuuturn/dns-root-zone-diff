name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Frontend build
        run: cd web/frontend && npm ci && npm run build

      # コミット済みの internal/web/static が最新の frontend ソースと
      # 一致していることを検証する (ビルド忘れの検出)。
      # git diff は未追跡ファイルを検査しないため、新規生成された chunk の
      # コミット忘れも検出できるよう git status で検査する。
      - name: Frontend dist check
        run: |
          status=$(git status --porcelain internal/web/static)
          if [ -n "$status" ]; then
            echo "internal/web/static is out of date. Run 'make frontend-build' and commit the result:"
            echo "$status"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out
