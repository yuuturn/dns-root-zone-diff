name: Frontend artifacts

# dependabot は web/frontend の依存パッケージ (package.json / package-lock.json) しか
# 更新しない。vite などビルドツールのバージョンが変わると internal/web/static の
# 成果物 (ハッシュ付き asset) も変わるため、ci の「Frontend dist check」が失敗する
# (PR #36 で発生)。
#
# このワークフローは dependabot PR でのみビルド成果物を自動コミットして PR ブランチに
# push し、ci を dispatch して再実行させる。人間の PR は従来どおり手動で
# make frontend-build の成果物をコミットする (このワークフローは何もしない)。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "web/frontend/**"

permissions:
  contents: write # ビルド成果物を PR ブランチに push する
  actions: write # 成果物 push 後に ci を dispatch する

concurrency:
  group: frontend-artifacts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-commit:
    # dependabot が同一リポジトリ内に切ったブランチのみを対象にする。
    # (fork の PR は GITHUB_TOKEN が読み取り専用になるため除外)
    if: startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Frontend build
        run: cd web/frontend && npm ci && npm run build

      - name: Check dist changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain internal/web/static)" ]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push dist
        if: steps.changes.outputs.dirty == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/static
          git commit \
            -m "chore: rebuild frontend static assets" \
            -m "Auto-generated by the frontend-artifacts workflow for PR #${{ github.event.pull_request.number }}."
          git push origin HEAD:"${{ github.head_ref }}"

      # GITHUB_TOKEN による push は再帰防止のため push / pull_request イベントを
      # 発火しないため、ci を当該ブランチで明示的に dispatch して
      # PR ブランチの checks を更新する。
      - name: Re-run ci on the updated branch
        if: steps.changes.outputs.dirty == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.head_ref }}"
