name: Frontend artifacts

# dependabot は web/frontend の依存パッケージ (package.json / package-lock.json) しか
# 更新しない。vite などビルドツールのバージョンが変わると internal/web/static の
# 成果物 (ハッシュ付き asset) も変わるため、ci の「Frontend dist check」が失敗する
# (PR #36 で発生)。
#
# このワークフローは dependabot PR でのみビルド成果物を自動コミットして PR ブランチに
# push する。人間の PR は従来どおり手動で make frontend-build の成果物をコミットする
# (このワークフローは何もしない)。
#
# 成果物の push に PAT (シークレット FRONTEND_ARTIFACTS_PAT) を使う理由:
# GITHUB_TOKEN による push は再帰防止のため push / pull_request イベントを発火せず、
# ci が新しい HEAD で再実行されない (workflow_dispatch による再実行では check が
# PR に紐付かず branch protection の required check "ci" を満たせないことも
# 検証済み)。PAT による push は synchronize イベントを発火するため、ci が
# 新しい HEAD で通常どおり再実行され required check が満たされる。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "web/frontend/**"

permissions:
  contents: read

concurrency:
  group: frontend-artifacts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-commit:
    # dependabot が同一リポジトリ内に切ったブランチのみを対象にする。
    # (fork の PR はシークレットが使えないため除外)
    if: startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # トークン未設定の場合に最初のステップで明確に失敗させる
      # (classic PAT の 'public_repo' スコープのみで良い。成果物のみを push するため
      #  'workflow' スコープは不要)
      - name: Verify push token is configured
        env:
          PAT: ${{ secrets.FRONTEND_ARTIFACTS_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Actions secret FRONTEND_ARTIFACTS_PAT is not configured."
            echo "Create a classic PAT with the 'public_repo' scope and add it as a"
            echo "repository Actions secret named FRONTEND_ARTIFACTS_PAT."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # GITHUB_TOKEN では push が workflow を再トリガーしないため PAT を使う
          token: ${{ secrets.FRONTEND_ARTIFACTS_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Frontend build
        run: cd web/frontend && npm ci && npm run build

      - name: Check dist changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain internal/web/static)" ]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      # 成果物に差分がある場合のみコミット・push する。push すると synchronize
      # イベントで ci が新しい HEAD で再実行される。push するのは
      # internal/web/static のみのため paths フィルタ (web/frontend/**) には
      # 一致せず、このワークフロー自身が再実行されることはない。
      - name: Commit and push dist
        if: steps.changes.outputs.dirty == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/static
          git commit \
            -m "chore: rebuild frontend static assets" \
            -m "Auto-generated by the frontend-artifacts workflow for PR #${{ github.event.pull_request.number }}."
          git push origin HEAD:"${{ github.head_ref }}"
