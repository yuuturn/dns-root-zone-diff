# Gitleaks configuration for dns-root-diff
# Extends the default ruleset and keeps config/runtime secret paths out of scans.

title = "dns-root-diff"

[extend]
useDefault = true

[allowlist]
description = "Project-local paths that may contain runtime secrets (never committed)"
paths = [
  '''(^|/)config\.yaml$''',
  '''(^|/)data/''',
  '''(^|/)\.hermes/''',
  '''(^|/)HANDOFF\.md$''',
  # フロントエンドのビルド成果物 (minified bundle) と lock ファイルは
  # 高エントロピー文字列による誤検知が起きやすいため除外する
  '''^internal/web/static/''',
  '''^web/frontend/package-lock\.json$''',
]
