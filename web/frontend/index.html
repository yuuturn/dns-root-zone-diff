<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- テーマ (dark / light) を React のマウント前に適用してちらつきを防ぐ。
         localStorage のキーとロジックは src/theme.ts と揃えること -->
    <script>
      (function () {
        var mode;
        try {
          mode = localStorage.getItem("theme");
        } catch (e) {
          mode = null;
        }
        if (mode !== "light" && mode !== "dark") {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.mode = mode;
      })();
    </script>
    <!-- ヘッダーの GlobeHemisphereWestIcon (@phosphor-icons) と同じ図形の favicon。
         SVG 内の prefers-color-scheme で light (#18181b) / dark (#f5f5f5) を切り替える -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- SVG favicon 非対応ブラウザ (Safari 26 未満など) 向けラスタフォールバック。
         light 版を先に置くことで、media 属性を見ないブラウザは light 版を使う。
         /favicon.ico は icon 宣言が無い場合の自動取得にも使われる -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>DNS Root Zone Diff</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
